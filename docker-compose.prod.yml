# ==============================================================================
# Nahom (Manage-My-Gate) - Production Docker Compose Stack
# Multi-container production deployment:
#   - MongoDB 7.0 (Single-node Replica Set 'rs0' for Mongoose Transactions)
#   - Redis Alpine (Session & Cache Broker)
#   - Backend API (Node.js Express / Socket.io) -> Port 5007:5000
#   - Frontend UI (Nginx Alpine Static Bundle)  -> Port 3005:80
# ==============================================================================


services:
  # ----------------------------------------------------------------------------
  # 1. MongoDB Database (Replica Set required for Mongoose multi-doc transactions)
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0.14
    container_name: mmg-mongodb
    restart: always
    environment:
      - GLIBC_TUNABLES=glibc.pthread.rseq=0
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-manageadmin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - TZ=${TZ:-Asia/Kolkata}
    ports:
      - "${DB_PORT_EXTERNAL:-27019}:27017"
    volumes:
      - mongodb_data:/data/db
    entrypoint:
      - /bin/sh
      - -c
      - |
        export GLIBC_TUNABLES=glibc.pthread.rseq=0
        if [ ! -f /data/db/replica.key ]; then
          openssl rand -base64 756 > /data/db/replica.key
          chmod 400 /data/db/replica.key
          chown 999:999 /data/db/replica.key 2>/dev/null || true
        fi
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /data/db/replica.key
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      mmg-network:
        aliases:
          - mongo
          - mongodb

  # ----------------------------------------------------------------------------
  # 2. MongoDB Replica Set Initializer (Runs once after MongoDB becomes healthy)
  # ----------------------------------------------------------------------------
  mongodb-rs-init:
    image: mongo:7.0.14
    container_name: mmg-mongodb-rs-init
    restart: "no"
    environment:
      - GLIBC_TUNABLES=glibc.pthread.rseq=0
      - TZ=${TZ:-Asia/Kolkata}
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        export GLIBC_TUNABLES=glibc.pthread.rseq=0
        until mongosh --host mongodb:27017 -u "${MONGO_ROOT_USER:-manageadmin}" -p "${MONGO_ROOT_PASSWORD}" --authenticationDatabase admin --eval 'print("ready")' > /dev/null 2>&1 || mongosh --host mongodb:27017 --eval 'print("ready")' > /dev/null 2>&1; do sleep 1; done
        mongosh --host mongodb:27017 -u "${MONGO_ROOT_USER:-manageadmin}" -p "${MONGO_ROOT_PASSWORD}" --authenticationDatabase admin --eval "try { rs.initiate({ _id: 'rs0', members: [ { _id: 0, host: 'mongodb:27017' } ] }) } catch (e) { print(e.message) }" || mongosh --host mongodb:27017 --eval "try { rs.initiate({ _id: 'rs0', members: [ { _id: 0, host: 'mongodb:27017' } ] }) } catch (e) { print(e.message) }"
    networks:
      - mmg-network

  # ----------------------------------------------------------------------------
  # 3. Redis In-Memory Cache & Session Broker
  # ----------------------------------------------------------------------------
  redis:
    image: redis:alpine
    container_name: mmg-redis
    restart: always
    ports:
      - "${REDIS_PORT_EXTERNAL:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mmg-network

  # ----------------------------------------------------------------------------
  # 4. Backend Application API
  # ----------------------------------------------------------------------------
  backend:
    image: ${BACKEND_IMAGE:-atocash/manage-my-gate-server:prd1.0}
    container_name: ${BACKEND_CONTAINER_NAME:-nahom-backend}
    restart: always
    ports:
      - "${SERVER_PORT:-5007}:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - TZ=${TZ:-Asia/Kolkata}
      - MONGODB_URI=mongodb://${MONGO_ROOT_USER:-manageadmin}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DB_NAME:-manage_my_gate_prod}?replicaSet=rs0&authSource=admin
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - VAULT_ENCRYPTION_KEY=${VAULT_ENCRYPTION_KEY:-${ENCRYPTION_KEY}}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL}
      - SUPER_ADMIN_USERNAME=${SUPER_ADMIN_USERNAME:-superadmin}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_ANDROID_CLIENT_ID=${GOOGLE_ANDROID_CLIENT_ID:-610778456829-6g1bvqtplfrgva93sbdsvgbuqmkpr203.apps.googleusercontent.com}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-00000000-0000-0000-0000-000000000000}
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID:-common}
      - CLIENT_URL=${CLIENT_URL:-https://managemygate.e3esg.com}
      - APP_CLIENT_URL=${APP_CLIENT_URL:-https://managemygate.e3esg.com}
      - WEB_CLIENT_URL=${WEB_CLIENT_URL:-https://managemygate.e3esg.com}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://managemygate.e3esg.com}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mmg-network

  # ----------------------------------------------------------------------------
  # 5. Frontend Web Application (Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    image: ${FRONTEND_IMAGE:-atocash/manage-my-gate-client:prd1.0}
    container_name: ${FRONTEND_CONTAINER_NAME:-nahom-frontend}
    restart: always
    ports:
      - "${CLIENT_PORT:-3005}:80"
    environment:
      - TZ=${TZ:-Asia/Kolkata}
    depends_on:
      - backend
    networks:
      - mmg-network

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  mongodb_data:
    name: mmg_mongodb_data
  redis_data:
    name: mmg_redis_data

# ------------------------------------------------------------------------------
# Dedicated Internal Bridge Network
# ------------------------------------------------------------------------------
networks:
  mmg-network:
    name: ${DOCKER_NETWORK:-mmg-network}
    driver: bridge
