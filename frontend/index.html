<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Nahom - Enterprise Resident & Visitor Access Management Portal">
    <meta name="author" content="Atominos Consulting">
    <meta name="keyword" content="Nahom, Visitor Access, Smart Gate, Resident Onboarding, Security Portal">
    <title>Nahom</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="shortcut icon" href="/favicon.svg">
    <script>
      // Apply the saved colour mode before first paint so the boot loader matches the app theme.
      (function () {
        try {
          var m = localStorage.getItem('coreui-free-react-admin-template-theme');
          if (m === 'auto' || !m) m = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-coreui-theme', m);
        } catch (e) {}
      })();
    </script>
    <style>
      #boot-loader{position:fixed;inset:0;z-index:3000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:#fff;transition:opacity .35s ease-out,visibility .35s}
      [data-coreui-theme=dark] #boot-loader{background:#212631}
      #boot-loader.bl-out{opacity:0;visibility:hidden;pointer-events:none}
      #boot-loader .bl-logo{position:relative;width:88px;height:88px;display:flex;align-items:center;justify-content:center;animation:bl-pop .6s cubic-bezier(.2,.8,.2,1) both}
      #boot-loader .bl-logo img{width:56px;height:56px;object-fit:contain}
      #boot-loader .bl-logo i{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(128,128,128,.25);border-top-color:#5856d6;animation:bl-spin .9s linear infinite;will-change:transform}
      #boot-loader .bl-bar{width:120px;height:3px;border-radius:3px;background:rgba(128,128,128,.2);overflow:hidden;animation:bl-fade .4s ease-out .3s both}
      #boot-loader .bl-bar b{display:block;width:40%;height:100%;border-radius:3px;background:#5856d6;animation:bl-slide 1.1s ease-in-out infinite;will-change:transform}
      #root{animation:bl-app .5s ease-out both}
      @keyframes bl-pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
      @keyframes bl-fade{from{opacity:0}to{opacity:1}}
      @keyframes bl-spin{to{transform:rotate(360deg)}}
      @keyframes bl-slide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
      @keyframes bl-app{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      @media (prefers-reduced-motion:reduce){#boot-loader *,#root{animation:none!important}#boot-loader{transition:none}}
    </style>
  </head>
  <body>
    <noscript>
      You need to enable JavaScript to run this app
    </noscript>
    <div id="boot-loader" role="status" aria-label="Loading"><div class="bl-logo"><i></i><img src="/favicon.svg" alt=""></div><div class="bl-bar"><b></b></div></div>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
    <!-- built files will be auto injected -->
  </body>
</html>
